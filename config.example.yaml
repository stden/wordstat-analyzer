# Пример конфигурации для анализа семантики
# Скопируй в config.yaml и отредактируй под свою нишу

niche:
  name: "доставка цветов"  # ← замени на свою нишу
  description: |
    Интернет-магазин доставки цветов и букетов.
    Целевая аудитория: люди, которые хотят заказать цветы 
    с доставкой на дом, в офис, на мероприятие.
    Продукты: букеты, композиции, цветы в горшках, 
    подарочные наборы с цветами.
  relevant_examples:
    - "заказать букет роз с доставкой"
    - "цветы на день рождения"
    - "доставка цветов круглосуточно"
    - "букет пионов цена"
    - "цветы в коробке купить"
  irrelevant_examples:
    - "как вырастить розы на даче"
    - "цветы из бисера своими руками"
    - "комнатные растения уход"
    - "цветок женское счастье пересадка"
    - "рисунок цветка карандашом"

input:
  file: "data/input.csv"
  query_column: "query"
  frequency_column: "frequency"  # закомментируй если нет частоты

processing:
  min_frequency: 10      # отсечь запросы с частотой < 10
  min_words: 1           # минимум слов в запросе
  batch_size: 300        # размер батча для LLM

embeddings:
  provider: "local"      # "local" = бесплатно, "openai" = лучше качество
  # openai_model: "text-embedding-3-small"

clustering:
  min_cluster_size: 10   # минимум запросов в кластере
  min_samples: 3

output:
  dir: "data/output"
